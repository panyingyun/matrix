<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1260" viewBox="0 0 1920 1260" role="img" aria-labelledby="title desc">
  <title id="title">matrixmul 代码架构图</title>
  <desc id="desc">matrixmul 工程代码架构：入口层（cmd/matrix、benchmark、e2e）依赖共享基础层（internal/matrixio、internal/kernel），并调用阶段 1~5 五种实现；五阶段共用统一签名 func Mul(A,B,C []float64, n int)，阶段 3/4/5 复用 AVX2/FMA 微内核 Mul2x16。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fbfd"/>
      <stop offset="1" stop-color="#eef4f7"/>
    </linearGradient>
    <linearGradient id="input" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dceefa"/>
      <stop offset="1" stop-color="#bad8ea"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e4f4df"/>
      <stop offset="1" stop-color="#c7e5c5"/>
    </linearGradient>
    <linearGradient id="stage1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5c7d8f"/>
      <stop offset="1" stop-color="#94aebe"/>
    </linearGradient>
    <linearGradient id="stage2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3d9a7d"/>
      <stop offset="1" stop-color="#72bda1"/>
    </linearGradient>
    <linearGradient id="stage3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7766ad"/>
      <stop offset="1" stop-color="#aa9bcf"/>
    </linearGradient>
    <linearGradient id="stage4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c2803a"/>
      <stop offset="1" stop-color="#e0a86a"/>
    </linearGradient>
    <linearGradient id="stage5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f7ca8"/>
      <stop offset="1" stop-color="#62b0cf"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#39556a" flood-opacity="0.16"/>
    </filter>
    <filter id="smallShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#39556a" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L6,3.5 L1,6 Z" fill="#637c89"/>
    </marker>
    <style>
      text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", "PingFang SC", Arial, sans-serif; fill: #18303f; }
      .title { font-size: 30px; font-weight: 700; }
      .section { font-size: 27px; font-weight: 700; }
      .file { font-size: 24px; font-weight: 700; }
      .body { font-size: 22px; }
      .small { font-size: 19px; }
      .card-title { font-size: 22px; font-weight: 700; fill: white; }
      .card-file { font-size: 16px; font-weight: 700; fill: white; }
      .card-body { font-size: 15px; fill: white; }
      .chip { font-size: 14px; font-weight: 700; }
      .pill-title { font-size: 20px; font-weight: 700; fill: #23414f; }
      .pill-body { font-size: 17px; fill: #3d5b6b; }
    </style>
  </defs>

  <rect width="1920" height="1260" fill="url(#bg)"/>
  <circle cx="120" cy="150" r="3" fill="#8fb3a5" opacity=".6"/>
  <circle cx="1800" cy="180" r="5" fill="#d4b862" opacity=".55"/>
  <circle cx="1845" cy="600" r="3" fill="#8fb3a5" opacity=".6"/>
  <circle cx="65" cy="560" r="4" fill="#d4b862" opacity=".55"/>

  <text x="54" y="58" class="title">matrixmul</text>
  <text x="54" y="88" class="small" fill="#66808e">1024×1024 float64 矩阵乘法 · Go 五阶段演进 · 代码架构（包依赖与模块分层）</text>

  <!-- Entry layer -->
  <g filter="url(#shadow)">
    <rect x="110" y="120" width="1700" height="160" rx="20" fill="url(#input)" stroke="#6f9eb9" stroke-width="2"/>
  </g>
  <text x="150" y="162" class="section">入口层 entrypoints</text>
  <line x1="690" y1="178" x2="690" y2="262" stroke="#8bb8d0" stroke-width="2"/>
  <line x1="1210" y1="178" x2="1210" y2="262" stroke="#8bb8d0" stroke-width="2"/>
  <g transform="translate(160,200)">
    <text x="0" y="0" class="file">cmd/matrix/main.go</text>
    <text x="20" y="36" class="body">• generate / multiply / verify</text>
    <text x="20" y="68" class="body">• stages 表统一调度 1~5（默认 5）</text>
  </g>
  <g transform="translate(726,200)">
    <text x="0" y="0" class="file">benchmark/main.go · bench_test.go</text>
    <text x="20" y="36" class="body">• 文件对比：耗时 / GF·s⁻¹ / 加速比</text>
    <text x="20" y="68" class="body">• -sizes 尺寸扫描 · Go 标准基准</text>
  </g>
  <g transform="translate(1246,200)">
    <text x="0" y="0" class="file">e2e/e2e_test.go</text>
    <text x="20" y="36" class="body">• 构建 cmd/matrix 跑真实子进程</text>
    <text x="20" y="68" class="body">• 黄金样例 case01–case11 比对</text>
  </g>

  <path d="M960 280V330" stroke="#637c89" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Shared foundation layer -->
  <g filter="url(#shadow)">
    <rect x="110" y="330" width="1700" height="170" rx="20" fill="url(#core)" stroke="#79a57a" stroke-width="2"/>
  </g>
  <text x="150" y="372" class="section">共享基础层 internal</text>
  <line x1="960" y1="388" x2="960" y2="472" stroke="#8db58c" stroke-width="2"/>
  <g transform="translate(170,410)">
    <text x="0" y="0" class="file">internal/matrixio/matrixio.go</text>
    <text x="20" y="36" class="body">• 二进制格式：魔数 MXMATRIX / 版本 / 组数 / 维数 / 种子</text>
    <text x="20" y="68" class="body">• OpenReader / OpenWriter（1 MiB 缓冲）· Read/WriteMatrix</text>
  </g>
  <g transform="translate(1030,410)">
    <text x="0" y="0" class="file">internal/kernel — Mul2x16 微内核</text>
    <text x="20" y="36" class="body">• kernel_amd64.s：AVX2/FMA 2 行 × 16 列（plan9 汇编）</text>
    <text x="20" y="68" class="body">• 阶段 3/4/5 共享 · kernel_test.go 单测 · 非 amd64 标量兜底</text>
  </g>

  <!-- Bus to the five stages -->
  <path d="M960 500V548" stroke="#637c89" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M270 548H1650" stroke="#637c89" stroke-width="2.5" fill="none"/>
  <path d="M270 548V598" stroke="#637c89" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M615 548V598" stroke="#637c89" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M960 548V598" stroke="#637c89" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M1305 548V598" stroke="#637c89" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M1650 548V598" stroke="#637c89" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="740" y="530" width="440" height="34" rx="17" fill="#f8fbfd" stroke="#c8d5de" stroke-width="2"/>
  <text x="960" y="554" class="small" text-anchor="middle" fill="#4d6a7a">统一接口 Mul(A, B, C []float64, n int)</text>

  <!-- Stage 1 -->
  <g filter="url(#shadow)">
    <rect x="110" y="600" width="320" height="350" rx="20" fill="url(#stage1)" stroke="#3f5f70" stroke-width="2"/>
  </g>
  <text x="128" y="640" class="card-title">阶段 1 · 朴素循环</text>
  <rect x="330" y="652" width="82" height="28" rx="14" fill="#eef5f9" opacity=".95"/>
  <text x="371" y="671" class="chip" text-anchor="middle" fill="#3f5f70">1× 基线</text>
  <line x1="128" y1="692" x2="412" y2="692" stroke="white" opacity=".35"/>
  <text x="128" y="726" class="card-file">naive.go</text>
  <text x="128" y="750" class="card-body">i-k-j 三重循环（单线程）</text>
  <text x="128" y="786" class="card-file">naive_test.go</text>
  <text x="128" y="810" class="card-body">手工 / 单位矩阵 / 累加</text>
  <line x1="128" y1="832" x2="412" y2="832" stroke="white" opacity=".25"/>
  <text x="128" y="866" class="card-body" opacity=".95">单次 ~465 ms · 4.6 GF/s</text>
  <text x="128" y="896" class="card-body" opacity=".95">相对阶段 1：1×（基准）</text>

  <!-- Stage 2 -->
  <g filter="url(#shadow)">
    <rect x="455" y="600" width="320" height="350" rx="20" fill="url(#stage2)" stroke="#277158" stroke-width="2"/>
  </g>
  <text x="473" y="640" class="card-title">阶段 2 · 分块并行</text>
  <rect x="675" y="652" width="82" height="28" rx="14" fill="#e5fff4" opacity=".95"/>
  <text x="716" y="671" class="chip" text-anchor="middle" fill="#257258">5.5×</text>
  <line x1="473" y1="692" x2="757" y2="692" stroke="white" opacity=".35"/>
  <text x="473" y="726" class="card-file">blocked.go</text>
  <text x="473" y="750" class="card-body">分块 64 + goroutine</text>
  <text x="473" y="786" class="card-file">blocked_test.go</text>
  <text x="473" y="810" class="card-body">16 行/任务，行间无锁</text>
  <line x1="473" y1="832" x2="757" y2="832" stroke="white" opacity=".25"/>
  <text x="473" y="866" class="card-body" opacity=".95">单次 ~85 ms · 25 GF/s</text>
  <text x="473" y="896" class="card-body" opacity=".95">n 小则任务不足，无并行</text>

  <!-- Stage 3 -->
  <g filter="url(#shadow)">
    <rect x="800" y="600" width="320" height="350" rx="20" fill="url(#stage3)" stroke="#5f4b94" stroke-width="2"/>
  </g>
  <text x="818" y="640" class="card-title">阶段 3 · AVX2 内核</text>
  <rect x="1020" y="652" width="82" height="28" rx="14" fill="#f2edff" opacity=".95"/>
  <text x="1061" y="671" class="chip" text-anchor="middle" fill="#655297">28.3×</text>
  <line x1="818" y1="692" x2="1102" y2="692" stroke="white" opacity=".35"/>
  <text x="818" y="726" class="card-file">avx2.go</text>
  <text x="818" y="750" class="card-body">Mul2x16 + 一维行并行</text>
  <text x="818" y="786" class="card-file">avx2_test.go</text>
  <text x="818" y="810" class="card-body">与阶段 1 交叉校验</text>
  <line x1="818" y1="832" x2="1102" y2="832" stroke="white" opacity=".25"/>
  <text x="818" y="866" class="card-body" opacity=".95">单次 ~16.4 ms · 131 GF/s</text>
  <text x="818" y="896" class="card-body" opacity=".95">n≤64 时只有 1 个任务</text>

  <!-- Stage 4 -->
  <g filter="url(#shadow)">
    <rect x="1145" y="600" width="320" height="350" rx="20" fill="url(#stage4)" stroke="#9a6122" stroke-width="2"/>
  </g>
  <text x="1163" y="640" class="card-title">阶段 4 · 打包 + 2D</text>
  <rect x="1365" y="652" width="82" height="28" rx="14" fill="#fff8ec" opacity=".97"/>
  <text x="1406" y="671" class="chip" text-anchor="middle" fill="#8a5620">44.8×</text>
  <line x1="1163" y1="692" x2="1447" y2="692" stroke="white" opacity=".35"/>
  <text x="1163" y="726" class="card-file">packed.go</text>
  <text x="1163" y="750" class="card-body">B 打包 + 固定 8×16 划分</text>
  <text x="1163" y="786" class="card-file">packed_test.go</text>
  <text x="1163" y="810" class="card-body">复用阶段 3 的 Mul2x16</text>
  <line x1="1163" y1="832" x2="1447" y2="832" stroke="white" opacity=".25"/>
  <text x="1163" y="866" class="card-body" opacity=".95">单次 ~10.4 ms · 207 GF/s</text>
  <text x="1163" y="896" class="card-body" opacity=".95">384 上仅 3.8×（尺寸依赖）</text>

  <!-- Stage 5 -->
  <g filter="url(#shadow)">
    <rect x="1490" y="600" width="320" height="350" rx="20" fill="url(#stage5)" stroke="#1f6a8f" stroke-width="3"/>
  </g>
  <text x="1508" y="640" class="card-title">阶段 5 · 自适应</text>
  <rect x="1692" y="652" width="100" height="28" rx="14" fill="#fff3d6" opacity=".97"/>
  <text x="1742" y="671" class="chip" text-anchor="middle" fill="#8a6a12">44.6× 默认</text>
  <line x1="1508" y1="692" x2="1792" y2="692" stroke="white" opacity=".35"/>
  <text x="1508" y="726" class="card-file">adaptive.go</text>
  <text x="1508" y="750" class="card-body">32 行 × 64 列任务带</text>
  <text x="1508" y="786" class="card-file">adaptive_test.go</text>
  <text x="1508" y="810" class="card-body">按需打包 + 阈值两侧校验</text>
  <line x1="1508" y1="832" x2="1792" y2="832" stroke="white" opacity=".25"/>
  <text x="1508" y="866" class="card-body" opacity=".95">单次 ~10.4 ms · 206 GF/s</text>
  <text x="1508" y="896" class="card-body" opacity=".95">384 上 31.5×，无塌陷点</text>

  <!-- Stage cards to test pills -->
  <path d="M270 950V1006" stroke="#637c89" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M615 950V1006" stroke="#637c89" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M960 950V1006" stroke="#637c89" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M1305 950V1006" stroke="#637c89" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M1650 950V1006" stroke="#637c89" stroke-width="2.5" marker-end="url(#arrow)"/>

  <g filter="url(#smallShadow)"><rect x="110" y="1010" width="320" height="100" rx="16" fill="#ecfaf5" stroke="#5ca58a" stroke-width="2"/></g>
  <text x="270" y="1050" class="pill-title" text-anchor="middle">阶段 1 单元测试</text>
  <text x="270" y="1082" class="pill-body" text-anchor="middle">手工 2×2 / 单位矩阵 / 累加</text>

  <g filter="url(#smallShadow)"><rect x="455" y="1010" width="320" height="100" rx="16" fill="#f4f0fb" stroke="#8b78bb" stroke-width="2"/></g>
  <text x="615" y="1050" class="pill-title" text-anchor="middle">阶段 2~5 交叉校验</text>
  <text x="615" y="1082" class="pill-body" text-anchor="middle">多尺寸，容差 1e-6 / 1e-9</text>

  <g filter="url(#smallShadow)"><rect x="800" y="1010" width="320" height="100" rx="16" fill="#eaf6fb" stroke="#4a9bb8" stroke-width="2"/></g>
  <text x="960" y="1050" class="pill-title" text-anchor="middle">微内核单测</text>
  <text x="960" y="1082" class="pill-body" text-anchor="middle">kernel_test：2 行 × 16 列</text>

  <g filter="url(#smallShadow)"><rect x="1145" y="1010" width="320" height="100" rx="16" fill="#fdf6e3" stroke="#c9a227" stroke-width="2"/></g>
  <text x="1305" y="1050" class="pill-title" text-anchor="middle">benchmark 基准</text>
  <text x="1305" y="1082" class="pill-body" text-anchor="middle">文件 / 尺寸扫描 / 标准基准</text>

  <g filter="url(#smallShadow)"><rect x="1490" y="1010" width="320" height="100" rx="16" fill="#fdeee6" stroke="#c8763f" stroke-width="2"/></g>
  <text x="1650" y="1050" class="pill-title" text-anchor="middle">e2e 端到端</text>
  <text x="1650" y="1082" class="pill-body" text-anchor="middle">case01–case11 黄金文件</text>

  <text x="110" y="1160" class="small" fill="#66808e">依赖方向：cmd/matrix · benchmark · e2e → stage1~5 → internal/kernel · internal/matrixio（go.mod: module matrixmul，Go 1.25）</text>
  <text x="110" y="1192" class="small" fill="#66808e">统一签名 func Mul(A, B, C []float64, n int) · 累加语义 C += A×B（调用前 clear(C)）· amd64 走汇编内核，其它平台走标量兜底</text>
  <text x="110" y="1224" class="small" fill="#66808e">阶段 4 的固定 8×16 划分只在 colsPer=ceil(n/16) 为 16 的倍数时有效；阶段 5 用固定 32 行 × 64 列任务带 + 按需打包消除该尺寸依赖</text>
</svg>
