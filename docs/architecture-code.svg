<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1240" viewBox="0 0 1920 1240" role="img" aria-labelledby="title desc">
  <title id="title">matrixmul 代码架构图</title>
  <desc id="desc">matrixmul 工程代码架构：入口层（cmd/matrix、benchmark）依赖共享基础层（internal/matrixio、internal/kernel），并调用阶段 1~4 四种实现；四阶段共用统一签名 func Mul(A,B,C []float64, n int)，阶段 3/4 复用 AVX2/FMA 微内核 Mul2x16。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fbfd"/>
      <stop offset="1" stop-color="#eef4f7"/>
    </linearGradient>
    <linearGradient id="input" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dceefa"/>
      <stop offset="1" stop-color="#bad8ea"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e4f4df"/>
      <stop offset="1" stop-color="#c7e5c5"/>
    </linearGradient>
    <linearGradient id="stage1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5c7d8f"/>
      <stop offset="1" stop-color="#94aebe"/>
    </linearGradient>
    <linearGradient id="stage2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3d9a7d"/>
      <stop offset="1" stop-color="#72bda1"/>
    </linearGradient>
    <linearGradient id="stage3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7766ad"/>
      <stop offset="1" stop-color="#aa9bcf"/>
    </linearGradient>
    <linearGradient id="stage4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c2803a"/>
      <stop offset="1" stop-color="#e0a86a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#39556a" flood-opacity="0.16"/>
    </filter>
    <filter id="smallShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#39556a" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L6,3.5 L1,6 Z" fill="#637c89"/>
    </marker>
    <style>
      text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", "PingFang SC", Arial, sans-serif; fill: #18303f; }
      .title { font-size: 30px; font-weight: 700; }
      .section { font-size: 27px; font-weight: 700; }
      .file { font-size: 24px; font-weight: 700; }
      .body { font-size: 22px; }
      .small { font-size: 19px; }
      .card-title { font-size: 22px; font-weight: 700; fill: white; }
      .card-file { font-size: 16px; font-weight: 700; fill: white; }
      .card-body { font-size: 15px; fill: white; }
      .chip { font-size: 14px; font-weight: 700; }
      .pill-title { font-size: 20px; font-weight: 700; fill: #23414f; }
      .pill-body { font-size: 17px; fill: #3d5b6b; }
    </style>
  </defs>

  <rect width="1920" height="1240" fill="url(#bg)"/>
  <circle cx="120" cy="150" r="3" fill="#8fb3a5" opacity=".6"/>
  <circle cx="1800" cy="180" r="5" fill="#d4b862" opacity=".55"/>
  <circle cx="1845" cy="600" r="3" fill="#8fb3a5" opacity=".6"/>
  <circle cx="65" cy="560" r="4" fill="#d4b862" opacity=".55"/>

  <text x="54" y="58" class="title">matrixmul</text>
  <text x="54" y="88" class="small" fill="#66808e">1024×1024 float64 矩阵乘法 · Go 四阶段演进 · 代码架构（包依赖与模块分层）</text>

  <!-- Entry layer -->
  <g filter="url(#shadow)">
    <rect x="110" y="120" width="1700" height="160" rx="20" fill="url(#input)" stroke="#6f9eb9" stroke-width="2"/>
  </g>
  <text x="150" y="162" class="section">入口层 entrypoints</text>
  <line x1="960" y1="178" x2="960" y2="262" stroke="#8bb8d0" stroke-width="2"/>
  <g transform="translate(170,200)">
    <text x="0" y="0" class="file">cmd/matrix/main.go</text>
    <text x="20" y="36" class="body">• generate / multiply / verify 三个子命令</text>
    <text x="20" y="68" class="body">• stages 表统一调度阶段 1~4（默认 4，最优）</text>
  </g>
  <g transform="translate(1030,200)">
    <text x="0" y="0" class="file">benchmark/main.go · bench_test.go</text>
    <text x="20" y="36" class="body">• 命令行横向对比：耗时 / GF·s⁻¹ / 加速比 / 误差</text>
    <text x="20" y="68" class="body">• Go 标准基准 + TestStagesMatchStage1（1…1024）</text>
  </g>
  <path d="M880 242H942" stroke="#6f9b76" stroke-width="3" marker-end="url(#arrow)" opacity=".8"/>

  <path d="M960 280V330" stroke="#637c89" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Shared foundation layer -->
  <g filter="url(#shadow)">
    <rect x="110" y="330" width="1700" height="170" rx="20" fill="url(#core)" stroke="#79a57a" stroke-width="2"/>
  </g>
  <text x="150" y="372" class="section">共享基础层 internal</text>
  <line x1="960" y1="388" x2="960" y2="472" stroke="#8db58c" stroke-width="2"/>
  <g transform="translate(170,410)">
    <text x="0" y="0" class="file">internal/matrixio/matrixio.go</text>
    <text x="20" y="36" class="body">• 二进制格式：魔数 MXMATRIX / 版本 / 组数 / 维数 / 种子</text>
    <text x="20" y="68" class="body">• OpenReader / OpenWriter（1 MiB 缓冲）· Read/WriteMatrix</text>
  </g>
  <g transform="translate(1030,410)">
    <text x="0" y="0" class="file">internal/kernel — Mul2x16 微内核</text>
    <text x="20" y="36" class="body">• kernel_amd64.s：AVX2/FMA 2 行 × 16 列（plan9 汇编）</text>
    <text x="20" y="68" class="body">• kernel_amd64.go 声明 · kernel_fallback.go 非 amd64 标量兜底</text>
  </g>

  <!-- Bus to the four stages -->
  <path d="M960 500V548" stroke="#637c89" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M310 548H1609" stroke="#637c89" stroke-width="2.5" fill="none"/>
  <path d="M310 548V598" stroke="#637c89" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M743 548V598" stroke="#637c89" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M1176 548V598" stroke="#637c89" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M1609 548V598" stroke="#637c89" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="740" y="530" width="440" height="34" rx="17" fill="#f8fbfd" stroke="#c8d5de" stroke-width="2"/>
  <text x="960" y="554" class="small" text-anchor="middle" fill="#4d6a7a">统一接口 Mul(A, B, C []float64, n int)</text>

  <!-- Stage 1 -->
  <g filter="url(#shadow)">
    <rect x="110" y="600" width="400" height="350" rx="20" fill="url(#stage1)" stroke="#3f5f70" stroke-width="2"/>
  </g>
  <text x="128" y="642" class="card-title">阶段 1 · 朴素三重循环</text>
  <rect x="392" y="652" width="100" height="28" rx="14" fill="#eef5f9" opacity=".95"/>
  <text x="442" y="671" class="chip" text-anchor="middle" fill="#3f5f70">1× 基线</text>
  <line x1="128" y1="692" x2="492" y2="692" stroke="white" opacity=".35"/>
  <text x="128" y="730" class="card-file">naive.go</text><text x="270" y="730" class="card-body">i-k-j 三重循环（无分块）</text>
  <text x="128" y="770" class="card-file">naive_test.go</text><text x="270" y="770" class="card-body">小矩阵 / 单位矩阵 / 累加</text>
  <text x="128" y="810" class="card-file">语义</text><text x="270" y="810" class="card-body">C += A×B（调用前 clear(C)）</text>
  <line x1="128" y1="842" x2="492" y2="842" stroke="white" opacity=".25"/>
  <text x="128" y="880" class="card-body" opacity=".95">单次 ~559 ms（1024×1024）</text>
  <text x="128" y="914" class="card-body" opacity=".95">吞吐 ~3.9 GF/s · 加速比 1×</text>

  <!-- Stage 2 -->
  <g filter="url(#shadow)">
    <rect x="543" y="600" width="400" height="350" rx="20" fill="url(#stage2)" stroke="#277158" stroke-width="2"/>
  </g>
  <text x="561" y="642" class="card-title">阶段 2 · 分块 + 行并行</text>
  <rect x="825" y="652" width="100" height="28" rx="14" fill="#e5fff4" opacity=".95"/>
  <text x="875" y="671" class="chip" text-anchor="middle" fill="#257258">6.8×</text>
  <line x1="561" y1="692" x2="925" y2="692" stroke="white" opacity=".35"/>
  <text x="561" y="730" class="card-file">blocked.go</text><text x="703" y="730" class="card-body">i-k-j 分块 64 + goroutine</text>
  <text x="561" y="770" class="card-file">blocked_test.go</text><text x="703" y="770" class="card-body">16 行/任务，行间无锁并行</text>
  <text x="561" y="810" class="card-file">sync</text><text x="703" y="810" class="card-body">WaitGroup 派发与汇合</text>
  <line x1="561" y1="842" x2="925" y2="842" stroke="white" opacity=".25"/>
  <text x="561" y="880" class="card-body" opacity=".95">单次 ~82 ms（1024×1024）</text>
  <text x="561" y="914" class="card-body" opacity=".95">吞吐 ~26 GF/s · 加速比 6.8×</text>

  <!-- Stage 3 -->
  <g filter="url(#shadow)">
    <rect x="976" y="600" width="400" height="350" rx="20" fill="url(#stage3)" stroke="#5f4b94" stroke-width="2"/>
  </g>
  <text x="994" y="642" class="card-title">阶段 3 · AVX2 微内核</text>
  <rect x="1258" y="652" width="100" height="28" rx="14" fill="#f2edff" opacity=".95"/>
  <text x="1308" y="671" class="chip" text-anchor="middle" fill="#655297">36.5×</text>
  <line x1="994" y1="692" x2="1358" y2="692" stroke="white" opacity=".35"/>
  <text x="994" y="730" class="card-file">avx2.go</text><text x="1136" y="730" class="card-body">Mul2x16 内核 + 一维并行</text>
  <text x="994" y="770" class="card-file">avx2_test.go</text><text x="1136" y="770" class="card-body">与阶段 1 交叉校验</text>
  <text x="994" y="810" class="card-file">kernel_test.go</text><text x="1136" y="810" class="card-body">微内核 2 行 × 16 列单测</text>
  <line x1="994" y1="842" x2="1358" y2="842" stroke="white" opacity=".25"/>
  <text x="994" y="880" class="card-body" opacity=".95">单次 ~15.3 ms（1024×1024）</text>
  <text x="994" y="914" class="card-body" opacity=".95">吞吐 ~140 GF/s · 加速比 36.5×</text>

  <!-- Stage 4 -->
  <g filter="url(#shadow)">
    <rect x="1409" y="600" width="400" height="350" rx="20" fill="url(#stage4)" stroke="#9a6122" stroke-width="2"/>
  </g>
  <text x="1427" y="642" class="card-title">阶段 4 · 打包 + 2D 划分</text>
  <rect x="1673" y="652" width="118" height="28" rx="14" fill="#fff8ec" opacity=".97"/>
  <text x="1732" y="671" class="chip" text-anchor="middle" fill="#8a5620">54.6× 最优</text>
  <line x1="1427" y1="692" x2="1791" y2="692" stroke="white" opacity=".35"/>
  <text x="1427" y="730" class="card-file">packed.go</text><text x="1569" y="730" class="card-body">B 打包（k 块 × j 块）</text>
  <text x="1427" y="770" class="card-file">packed_test.go</text><text x="1569" y="770" class="card-body">行 8 × 列 16 = 128 任务</text>
  <text x="1427" y="810" class="card-file">复用内核</text><text x="1569" y="810" class="card-body">与阶段 3 同一 Mul2x16</text>
  <line x1="1427" y1="842" x2="1791" y2="842" stroke="white" opacity=".25"/>
  <text x="1427" y="880" class="card-body" opacity=".95">单次 ~10.2 ms（1024×1024）</text>
  <text x="1427" y="914" class="card-body" opacity=".95">吞吐 ~210 GF/s（峰值 285.9）</text>

  <!-- Stage cards to test/artifact pills -->
  <path d="M310 950V1006" stroke="#637c89" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M743 950V1006" stroke="#637c89" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M1176 950V1006" stroke="#637c89" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M1609 950V1006" stroke="#637c89" stroke-width="2.5" marker-end="url(#arrow)"/>

  <g filter="url(#smallShadow)"><rect x="110" y="1010" width="400" height="100" rx="16" fill="#ecfaf5" stroke="#5ca58a" stroke-width="2"/></g>
  <text x="310" y="1050" class="pill-title" text-anchor="middle">阶段 1 单元测试</text>
  <text x="310" y="1082" class="pill-body" text-anchor="middle">手工 2×2 / 3×3 / 单位矩阵 / 累加语义</text>

  <g filter="url(#smallShadow)"><rect x="543" y="1010" width="400" height="100" rx="16" fill="#f4f0fb" stroke="#8b78bb" stroke-width="2"/></g>
  <text x="743" y="1050" class="pill-title" text-anchor="middle">阶段 2~4 交叉校验</text>
  <text x="743" y="1082" class="pill-body" text-anchor="middle">与阶段 1 比对：容差 1e-6 / 1e-9</text>

  <g filter="url(#smallShadow)"><rect x="976" y="1010" width="400" height="100" rx="16" fill="#eaf6fb" stroke="#4a9bb8" stroke-width="2"/></g>
  <text x="1176" y="1050" class="pill-title" text-anchor="middle">微内核 + 多尺寸一致性</text>
  <text x="1176" y="1082" class="pill-body" text-anchor="middle">kernel_test · TestStagesMatchStage1</text>

  <g filter="url(#smallShadow)"><rect x="1409" y="1010" width="400" height="100" rx="16" fill="#fdf6e3" stroke="#c9a227" stroke-width="2"/></g>
  <text x="1609" y="1050" class="pill-title" text-anchor="middle">性能评测（独立目录）</text>
  <text x="1609" y="1082" class="pill-body" text-anchor="middle">benchmark 命令行 + Go 标准基准</text>

  <text x="110" y="1156" class="small" fill="#66808e">依赖方向：cmd/matrix · benchmark → stage1~4 → internal/kernel · internal/matrixio（go.mod: module matrixmul，Go 1.25）</text>
  <text x="110" y="1188" class="small" fill="#66808e">统一签名 func Mul(A, B, C []float64, n int) · 累加语义 C += A×B · amd64 走汇编内核，其它平台走标量兜底</text>
</svg>
